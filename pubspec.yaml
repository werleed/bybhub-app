name: bybhub_app
description: BYBHUB — China-to-West-Africa Importation & Marketplace Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.6.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.3.1
  webview_flutter: ^4.8.0
  intl: ^0.20.0
  url_launcher: ^6.3.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/

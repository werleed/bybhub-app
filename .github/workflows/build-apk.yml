name: Build BYBHUB APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.5.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.5.0'
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n || true

      - name: Build Debug APK
        run: flutter build apk --debug --dart-define=API_URL=https://bybimport.com

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bybhub-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

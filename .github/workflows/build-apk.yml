name: Build BYBHUB APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n || true

      - name: Create default app icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          # Copy Flutter's default launcher icon
          cp $(flutter --machine | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['flutterRoot'])")/packages/flutter_tools/templates/app_shared/android.tmpl/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp $(flutter --machine | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['flutterRoot'])")/packages/flutter_tools/templates/app_shared/android.tmpl/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          cp $(flutter --machine | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['flutterRoot'])")/packages/flutter_tools/templates/app_shared/android.tmpl/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp $(flutter --machine | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['flutterRoot'])")/packages/flutter_tools/templates/app_shared/android.tmpl/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp $(flutter --machine | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['flutterRoot'])")/packages/flutter_tools/templates/app_shared/android.tmpl/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

      - name: Build APK
        run: flutter build apk --debug --dart-define=API_URL=https://bybimport.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bybhub-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
